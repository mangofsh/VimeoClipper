<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vimeo Video Clipper - Timestamp Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#10b981' // Emerald (GPT green)
          },
          fontFamily: {
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    };
  </script>
  <link href="https://cdn.jsdelivr.net/npm/@tailwindcss/typography@0.5.9/dist/typography.min.css" rel="stylesheet">

  <style>
    /* Custom dark mode styles for typography */
    .prose {
      color: #e2e8f0;
      max-width: none;
    }
    
    .prose h1, 
    .prose h2, 
    .prose h3 {
      color: white;
      margin-top: 1.5em;
      margin-bottom: 0.8em;
      font-weight: 600;
    }
    
    .prose h1 {
      font-size: 1.875rem;
      line-height: 2.25rem;
    }
    
    .prose h2 {
      font-size: 1.5rem;
      line-height: 2rem;
    }
    
    .prose h3 {
      font-size: 1.25rem;
      line-height: 1.75rem;
      color: #f0f9ff;
    }
    
    .prose p {
      margin-top: 0.75em;
      margin-bottom: 0.75em;
    }
    
    .prose strong {
      color: #f0f9ff;
      font-weight: 600;
    }
    
    .prose mark {
      background-color: #22c55e33;
      color: #bbf7d0;
      padding: 0 0.2em;
      border-radius: 0.25rem;
    }
    
    .prose ul {
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      list-style-type: disc;
      padding-left: 1.625em;
    }
    
    .prose li {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
    }
    
    .prose hr {
      border-color: #4b5563;
      margin-top: 2em;
      margin-bottom: 2em;
    }
    
    /* Profile section spacing */
    .profile-section {
      border-bottom: 1px solid #4b5563;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
    }
    
    .profile-section:last-child {
      border-bottom: none;
    }
  </style>
  
</head>
<body class="dark bg-gray-900 text-gray-100">
  <div class="max-w-3xl mx-auto mt-12 bg-gray-800 shadow-xl rounded-lg p-8">
    <h1 class="text-2xl font-semibold mb-6">VIMEO VIDEO CLIPPER</h1>
    <p class="text-gray-400 mb-6">Generate timestamps for the most relevant parts of your Vimeo video</p>

    <label for="videoLength" class="block font-medium mb-1 text-gray-300">Video Length (in seconds):</label>
    <input type="number" id="videoLength" placeholder="1744" min="1" max="7200"
           class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white mb-4 placeholder-gray-500" />
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
      <div>
        <label for="minClipLength" class="block font-medium mb-1 text-gray-300">Min Clip Length (seconds):</label>
        <input type="number" id="minClipLength" placeholder="30" min="10" max="300"
               class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white placeholder-gray-500" />
      </div>
      <div>
        <label for="maxClipLength" class="block font-medium mb-1 text-gray-300">Max Clip Length (seconds):</label>
        <input type="number" id="maxClipLength" placeholder="120" min="30" max="600"
               class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white placeholder-gray-500" />
      </div>
      <div>
        <label for="numberOfClips" class="block font-medium mb-1 text-gray-300">Number of Clips:</label>
        <input type="number" id="numberOfClips" placeholder="5" min="1" max="20"
               class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white placeholder-gray-500" />
      </div>
    </div>
    <button class="bg-primary text-white px-4 py-2 rounded hover:bg-emerald-600 transition" onclick="checkVideo()">Continue</button>

    <p id="statusMessage" class="mt-4 text-sm text-gray-400 font-medium"></p>

    <div id="videoSection" class="hidden mt-8">
      <div id="generatedOutput" class="bg-gray-700 p-6 rounded-md"></div>

      <div id="editControls" class="hidden mt-4 flex gap-3">
        <button class="bg-gray-700 text-white border border-gray-500 px-4 py-2 rounded hover:bg-gray-600 transition" onclick="enterEditMode()">Edit</button>
        <button class="bg-primary text-white px-4 py-2 rounded hidden" onclick="saveEdits()">Save Changes</button>
      </div>

      <div id="initialButtonContainer" class="mt-8">
        <input type="text" id="VideoID" placeholder="Enter Vimeo ID"
           class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white mb-4 placeholder-gray-500" />
      </div>

      <div id="contextSection" class="hidden mt-8">
        <h2 class="text-lg font-semibold mb-2 text-white">📘 Clip Focus Areas</h2>
        <textarea
          id="userContext"
          placeholder="Describe what topics, moments, or content you want to highlight in the clips (e.g., 'key insights about AI implementation', 'product demonstrations', 'customer testimonials')…"
          class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white placeholder-gray-500 mb-4 resize-y"
          style="min-height: 6rem;"
        ></textarea>
        <button class="bg-primary text-white px-4 py-2 rounded hover:bg-emerald-600 transition" onclick="downloadVideo()">Generate Timestamps</button>

      </div>      

      <div id="enrichmentSection" class="hidden mt-8">
        <h2 class="text-lg font-semibold mb-2 text-white">📝 Refinement Notes</h2>
        <textarea id="userEnrichment" placeholder="Add any additional focus areas or refinements for the clip selection..."
                  class="w-full p-3 border border-gray-600 rounded bg-gray-900 text-white placeholder-gray-500 mb-4 h-32"></textarea>
        <button class="bg-primary text-white px-4 py-2 rounded hover:bg-emerald-600 transition" onclick="generateEnhanced()">Regenerate Timestamps</button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-80 hidden flex items-center justify-center z-50">
    <div class="animate-spin rounded-full h-14 w-14 border-t-4 border-emerald-500 border-opacity-75"></div>
  </div>

  <script>


    let currentTimestampMarkdown = null;
    let currentVideoLength = null;
    let isEditing = false;

    function checkVideo() {
      const videoLength = document.getElementById("videoLength").value.trim();
      const minLength = document.getElementById("minClipLength").value.trim();
      const maxLength = document.getElementById("maxClipLength").value.trim();
      const numClips = document.getElementById("numberOfClips").value.trim();
      
      if (!videoLength) return alert("Enter video length.");
      if (!minLength) return alert("Enter minimum clip length.");
      if (!maxLength) return alert("Enter maximum clip length.");
      if (!numClips) return alert("Enter number of clips.");
      
      if (parseInt(minLength) >= parseInt(maxLength)) {
        return alert("Minimum clip length must be less than maximum clip length.");
      }
      
      if (parseInt(maxLength) > parseInt(videoLength)) {
        return alert(`Maximum clip length (${maxLength}s) cannot exceed video length (${videoLength}s).`);
      }
      
      if (parseInt(numClips) * parseInt(minLength) > parseInt(videoLength)) {
        return alert(`Cannot create ${numClips} clips of minimum ${minLength}s each in a ${videoLength}s video. Total minimum time would be ${parseInt(numClips) * parseInt(minLength)}s.`);
      }
      
      currentVideoLength = videoLength;
      document.getElementById("videoSection").classList.remove("hidden");
      document.getElementById("initialButtonContainer").classList.remove("hidden");
      document.getElementById("generatedOutput").classList.add("hidden");
      document.getElementById("enrichmentSection").classList.add("hidden");
      document.getElementById("editControls").classList.add("hidden");
      document.getElementById("contextSection").classList.remove("hidden");
      document.getElementById("statusMessage").innerText = `🆕 Ready to generate timestamps for ${videoLength}-second video`;
    }

    async function downloadVideo() {
      const videoId = document.getElementById("VideoID").value.trim();
      if (!videoId) {
        alert("Please enter a Vimeo ID.");
        return;
      }
      
      document.getElementById("statusMessage").innerText = "⏳ Analyzing video for best clips... (May take up to 5 minutes)";
      document.getElementById("loadingOverlay").classList.remove("hidden");

      try {
        const response = await fetch("/api/run_pipeline", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ video_id: videoId })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          document.getElementById("statusMessage").innerText = "✅ Video analysis completed successfully.";
          generateInitial(result.transcript, result.metadata);
        } else {
          document.getElementById("statusMessage").innerText = `❌ Error: ${result.error}`;
          document.getElementById("loadingOverlay").classList.add("hidden");
        }
      } catch (error) {
        console.error(error);
        document.getElementById("statusMessage").innerText = "❌ Error during pipeline execution.";
        document.getElementById("loadingOverlay").classList.add("hidden");
      }
    }




    async function generateInitial(transcript, metadata) {

      const contextNotes = document.getElementById("userContext").value.trim();
      const minLength = document.getElementById("minClipLength").value.trim();
      const maxLength = document.getElementById("maxClipLength").value.trim();
      const numClips = document.getElementById("numberOfClips").value.trim();
      
      document.getElementById("statusMessage").innerText = "⏳ Analyzing video for best clips...";
      document.getElementById("loadingOverlay").classList.remove("hidden");

      const prompt = `
You are an expert Video Content Analyzer. Your PRIMARY task is to find video clips that specifically match what the user is looking for.

**🎯 PRIMARY FOCUS: The user wants clips about: "${contextNotes}"**
**This is the MOST IMPORTANT requirement - prioritize clips that directly relate to these topics.**

**CRITICAL CONSTRAINT: The total video length is ${currentVideoLength} seconds (${Math.floor(currentVideoLength / 60)}:${(currentVideoLength % 60).toString().padStart(2, '0')}). ALL timestamps must be within this duration.**

**ANALYSIS INSTRUCTIONS:**
1. FIRST: Scan the transcript for sections that directly discuss or relate to: "${contextNotes}"
2. SECOND: Identify the most relevant moments that match the user's specific interests
3. THIRD: Select clips that best represent what the user is looking for

**Requirements:**
- Each clip should be between ${minLength} and ${maxLength} seconds long
- ALL timestamps must be within the video duration of ${currentVideoLength} seconds
- **PRIORITIZE clips that directly relate to: "${contextNotes}"**
- If no content matches the user's focus areas, select the most relevant general content
- Avoid repetitive or less important content
- Ensure clips have clear start and end points with meaningful content
- Do NOT generate timestamps that exceed the video length

Output Format:
Provide timestamps in the following format for each clip:

# Video Clip Timestamps

## Clip 1: [Brief description of what happens in this clip]
**Start:** [MM:SS]
**End:** [MM:SS]
**Duration:** [X seconds]

## Clip 2: [Brief description of what happens in this clip]
**Start:** [MM:SS]
**End:** [MM:SS]
**Duration:** [X seconds]

[Continue for all ${numClips} clips]

### Video Metadata:
${metadata}

### Transcript:
${transcript}

### 🎯 USER'S SPECIFIC FOCUS AREAS - PRIORITIZE THESE TOPICS:
**"${contextNotes}"**

**IMPORTANT: The clips you select MUST be relevant to these specific topics. If the video doesn't contain content about these topics, explain why and select the most relevant alternative content.**

### Video Length: ${currentVideoLength} seconds (${Math.floor(currentVideoLength / 60)}:${(currentVideoLength % 60).toString().padStart(2, '0')})
### Minimum Clip Length: ${minLength} seconds
### Maximum Clip Length: ${maxLength} seconds
### Number of Clips Requested: ${numClips}

**IMPORTANT: Double-check that all timestamps are within the ${currentVideoLength}-second video duration. The maximum possible timestamp should be ${Math.floor((currentVideoLength - 1) / 60)}:${((currentVideoLength - 1) % 60).toString().padStart(2, '0')}.**

**FINAL REMINDER: The user specifically wants clips about "${contextNotes}". Make sure your selected clips directly relate to these topics. If you cannot find content matching these topics, explain why and select the most relevant alternative content. Recheck to make sure the time stamps you chose actually include the content wanted by the user.**

    `.trim();



      const content = await fetchFromOpenAI(prompt);
      currentTimestampMarkdown = content;
      renderMarkdown(content);
      document.getElementById("initialButtonContainer").classList.add("hidden");
      document.getElementById("contextSection").classList.add("hidden");
      document.getElementById("enrichmentSection").classList.remove("hidden");
      document.getElementById("editControls").classList.remove("hidden");
      document.getElementById("loadingOverlay").classList.add("hidden");
      document.getElementById("statusMessage").innerText = `✅ Timestamps generated for ${currentVideoLength}-second video`;
    }

    async function generateEnhanced() {
      if (isEditing) {
        const save = confirm("You have unsaved edits. Save first?");
        if (save) saveEdits(); else return;
      }

      document.getElementById("statusMessage").innerText = "⏳ Refining timestamps...";
      document.getElementById("loadingOverlay").classList.remove("hidden");

      const contextNotes = document.getElementById("userContext").value.trim();
      const notes = document.getElementById("userEnrichment").value;
      const minLength = document.getElementById("minClipLength").value.trim();
      const maxLength = document.getElementById("maxClipLength").value.trim();
      const numClips = document.getElementById("numberOfClips").value.trim();
      
      const prompt = `
You are an expert Video Content Analyzer. Refine the existing timestamps based on the user's additional feedback and focus areas.

**🎯 PRIMARY FOCUS: The user wants clips about: "${contextNotes}"**
**This is the MOST IMPORTANT requirement - prioritize clips that directly relate to these topics.**

**CRITICAL CONSTRAINT: The total video length is ${currentVideoLength} seconds (${Math.floor(currentVideoLength / 60)}:${(currentVideoLength % 60).toString().padStart(2, '0')}). ALL timestamps must be within this duration.**

**REFINEMENT INSTRUCTIONS:**
1. FIRST: Review the current timestamps and see how well they match: "${contextNotes}"
2. SECOND: Use the refinement notes to improve focus on the user's specific interests
3. THIRD: Adjust timestamps to better capture content related to the user's focus areas

Requirements:
- Each clip should be between ${minLength} and ${maxLength} seconds long
- ALL timestamps must be within the video duration of ${currentVideoLength} seconds
- **PRIORITIZE clips that directly relate to: "${contextNotes}"**
- Incorporate the refinement notes provided
- Ensure clips have clear start and end points with meaningful content
- Do NOT generate timestamps that exceed the video length

Output Format:
Provide timestamps in the following format for each clip:

# Video Clip Timestamps

## Clip 1: [Brief description of what happens in this clip]
**Start:** [MM:SS]
**End:** [MM:SS]
**Duration:** [X seconds]

[Continue for all ${numClips} clips]

### Current Timestamps:
${currentTimestampMarkdown}

### 🎯 USER'S SPECIFIC FOCUS AREAS - PRIORITIZE THESE TOPICS:
**"${contextNotes}"**

### Refinement Notes:
${notes}

**IMPORTANT: The refined clips you select MUST be relevant to these specific topics: "${contextNotes}". Use the refinement notes to improve focus on these areas.**

### Video Length: ${currentVideoLength} seconds (${Math.floor(currentVideoLength / 60)}:${(currentVideoLength % 60).toString().padStart(2, '0')})
### Minimum Clip Length: ${minLength} seconds
### Maximum Clip Length: ${maxLength} seconds
### Number of Clips Requested: ${numClips}

**IMPORTANT: Double-check that all timestamps are within the ${currentVideoLength}-second video duration. The maximum possible timestamp should be ${Math.floor((currentVideoLength - 1) / 60)}:${((currentVideoLength - 1) % 60).toString().padStart(2, '0')}.**

**FINAL REMINDER: The user specifically wants clips about "${contextNotes}". Make sure your refined clips directly relate to these topics. Use the refinement notes to improve focus on these specific areas.**
      `.trim();

      const content = await fetchFromOpenAI(prompt);
      currentTimestampMarkdown = content;
      renderMarkdown(content);
      document.getElementById("userEnrichment").value = "";
      document.getElementById("loadingOverlay").classList.add("hidden");
      document.getElementById("statusMessage").innerText = "✅ Timestamps refined.";
    }

    function enterEditMode() {
      if (isEditing) return;
      isEditing = true;

      document.getElementById("generatedOutput").classList.add("hidden");
      const area = document.createElement("textarea");
      area.id = "editArea";
      area.className = "w-full h-96 p-3 border border-gray-600 rounded bg-gray-900 text-white font-mono";
      area.value = currentTimestampMarkdown;
      document.getElementById("editControls").before(area);

      document.querySelector("#editControls button[onclick='enterEditMode()']").classList.add("hidden");
      document.querySelector("#editControls button[onclick='saveEdits()']").classList.remove("hidden");
    }

    function saveEdits() {
      const area = document.getElementById("editArea");
      if (!area) return;
      currentTimestampMarkdown = area.value;
      area.remove();
      isEditing = false;
      renderMarkdown(currentTimestampMarkdown);
      document.getElementById("generatedOutput").classList.remove("hidden");

      document.querySelector("#editControls button[onclick='enterEditMode()']").classList.remove("hidden");
      document.querySelector("#editControls button[onclick='saveEdits()']").classList.add("hidden");
    }

    function renderMarkdown(mdText) {
        const videoLength = document.getElementById("videoLength").value.trim();
        const header = videoLength ? `<h2 class="text-lg font-semibold mb-2">🎬 Video Clips for ${videoLength}-second video</h2>` : "";
        
        // Highlight timestamps for better visibility
        const highlighted = mdText
            .replace(/\*\*Start:\*\* \[([0-9:]+)\]/g, '<strong class="text-emerald-400">Start:</strong> <span class="bg-emerald-900 text-emerald-100 px-2 py-1 rounded font-mono">[$1]</span>')
            .replace(/\*\*End:\*\* \[([0-9:]+)\]/g, '<strong class="text-emerald-400">End:</strong> <span class="bg-emerald-900 text-emerald-100 px-2 py-1 rounded font-mono">[$1]</span>')
            .replace(/\*\*Duration:\*\* \[([0-9]+) seconds\]/g, '<strong class="text-emerald-400">Duration:</strong> <span class="bg-blue-900 text-blue-100 px-2 py-1 rounded font-mono">[$1 seconds]</span>');

        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: false
        });

        const parsedContent = marked.parse(highlighted);
        
        // Process the parsed content to add section styling for clips
        const processedContent = parsedContent
            .replace(/<h2/g, '<div class="profile-section"><h2')
            .replace(/<h2/g, '<h2 class="text-xl font-bold mt-6 mb-3 text-white"')
            .replace(/<\/h2>/g, '</h2>')
            // Add closing div for sections before the next h2 or at the end
            .replace(/<\/div><div class="profile-section">/g, '</div><div class="profile-section">')
            + '</div>';

        document.getElementById("generatedOutput").innerHTML = `
            <div class="prose">
                ${header}
                ${processedContent}
            </div>
        `;
        
        document.getElementById("generatedOutput").classList.remove("hidden");
    }

  async function fetchFromOpenAI(promptText) {
    const response = await fetch("/api/generate-profile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: promptText
      })
    });
    const data = await response.json();
    return data.content || "⚠️ No response from GPT.";
}

    window.addEventListener("load", () => {
      document.getElementById("loadingOverlay").classList.add("hidden");
    });
  </script>
</body>
</html>
